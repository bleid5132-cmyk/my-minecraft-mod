name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon -Pmod_version=1.0.${{ github.run_number }} 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p /tmp/log && grep -E "error:|warning:|What went wrong|FAILURE|\.java:[0-9]+" -A3 build.log | head -200 > /tmp/log/errors.txt || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git fetch origin build-logs || true
          git checkout --orphan build-logs-tmp
          git rm -rf --cached . > /dev/null
          cp /tmp/log/errors.txt errors.txt
          git add errors.txt && git commit -m "build ${{ github.run_number }} log"
          git push -f origin HEAD:build-logs

      - name: Export library jars (for inspection)
        if: success()
        run: |
          mkdir -p /tmp/libs
          find ~/.gradle/caches -name "armor-model-api*.jar" -not -name "*sources*" -exec cp {} /tmp/libs/ \; || true
          find ~/.gradle/caches -name "bendy-lib*.jar" -not -name "*sources*" -exec cp {} /tmp/libs/ \; || true
          ls -la /tmp/libs
          cd /tmp/libs && git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "libs ${{ github.run_number }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git HEAD:libs || true

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: vestments
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Priest Vestments 1.0.${{ github.run_number }}
          make_latest: true
          files: build/libs/vestments-*.jar
